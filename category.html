<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Category — Full Sheet View</title>
<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var cat = (params.get('type') || params.get('cat') || params.get('category') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    var map = {
        '45degree': '45-degree.html',
        'fabric': '45-degree.html',
        'wooden': 'wooden.html',
        'digital': 'digital.html',
        'charcoal': 'digital.html',
        'charcoalpanels': 'digital.html',
        'laminates': 'laminates.html',
        'stone': 'stone.html',
        'thermolam': 'stone.html',
        'louvers': 'louvers.html',
        'edgebands': 'edge-bands.html',
        'texture': 'texture.html'
    };
    var target = map[cat] || '45-degree.html';
    window.location.replace(target);
})();
</script>
</head>
<body style="font-family: system-ui, sans-serif; background: #f5f0e8; color: #14110f; padding: 40px; text-align: center;">
<p>Opening gallery... <a href="45-degree.html">Click here if not redirected automatically</a>.</p>
</body>
</html>
