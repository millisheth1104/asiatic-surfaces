<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital — Full Sheet View</title>
<meta name="description" content="Digital sheets shown as full sheets. High-resolution digital print faces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asar&family=Palanquin:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body class="page-gallery" data-category="Digital">

<div class="scroll-progress" aria-hidden="true"><span id="scrollBar"></span></div>

<header class="gnav">
  <a class="gnav__home" href="index.html">
    <svg viewBox="0 0 20 20" fill="none"><path d="M16 10H4M9 4.5 3.5 10 9 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Digital</span>
  </a>
</header>

<main class="gpage" data-category="Digital">

  <header class="ghead">
    <p class="eyebrow"><span class="eyebrow__rule"></span>The Collection</p>
    <h1 class="ghead__title">Digital <span class="italic">sheets</span></h1>
    <p class="ghead__sub">High-resolution digital print faces. Any artwork, colour-true, wear-rated and precision engineered.</p>
  </header>

  <!-- Masonry Gallery - dynamically populated from Product Catalog -->
  <div class="masonry" id="masonry"></div>

</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Full sheet view" aria-hidden="true">
  <div class="lb__bar">
    <p class="lb__code"></p>
    <span class="lb__count"></span>
    <button class="lb__x" type="button" aria-label="Close"><svg viewBox="0 0 20 20" fill="none"><path d="m5.5 5.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="lb__stage">
    <button class="lb__nav lb__nav--prev" type="button" aria-label="Previous sheet"><svg viewBox="0 0 20 20" fill="none"><path d="M12 4.5 6.5 10 12 15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <img alt="">
    <button class="lb__nav lb__nav--next" type="button" aria-label="Next sheet"><svg viewBox="0 0 20 20" fill="none"><path d="M8 4.5 13.5 10 8 15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <p class="lb__foot">Digital · Full Sheet View</p>
</div>

<footer class="gfoot">
  <span>Full Sheet View</span>
  <span>© <span id="yr">2026</span></span>
</footer>

<!-- Shared Product Data Engine & Dynamic Masonry Gallery -->
<script src="products-data.js"></script>
<script src="assets/js/gallery.js"></script>
</body>
</html>
