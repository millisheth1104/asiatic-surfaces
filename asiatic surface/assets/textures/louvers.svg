<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- the recess behind the slats, with the shadow each slat casts into it -->
    <linearGradient id="lRecess" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0a0603"/>
      <stop offset="0.35" stop-color="#1d1108"/>
      <stop offset="0.72" stop-color="#0d0804"/>
      <stop offset="1"   stop-color="#050302"/>
    </linearGradient>

    <!-- a slat face read as a cylinder: shadowed arris, hot highlight, falling mid, dark arris -->
    <linearGradient id="lSlat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2b1c0e"/>
      <stop offset="0.06" stop-color="#7a4f27"/>
      <stop offset="0.22" stop-color="#c48f52"/>
      <stop offset="0.34" stop-color="#e0b781"/>
      <stop offset="0.52" stop-color="#b47c42"/>
      <stop offset="0.76" stop-color="#7b4d24"/>
      <stop offset="0.93" stop-color="#40270f"/>
      <stop offset="1"    stop-color="#170d05"/>
    </linearGradient>

    <!-- the lit top edge of each slat -->
    <linearGradient id="lTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffdcac" stop-opacity=".72"/>
      <stop offset="0.4" stop-color="#c99a5f" stop-opacity=".30"/>
      <stop offset="1"   stop-color="#c99a5f" stop-opacity="0"/>
    </linearGradient>

    <pattern id="lPat" width="122" height="1100" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="122" height="1100" fill="url(#lRecess)"/>
      <rect x="17" y="0" width="88" height="1100" rx="7" fill="url(#lSlat)"/>
      <rect x="17" y="0" width="88" height="26" rx="7" fill="url(#lTop)"/>
      <rect x="103" y="0" width="14" height="1100" fill="#000000" opacity=".55"/>
    </pattern>

    <!-- tighter slats on the right read as depth -->
    <pattern id="lPatFar" width="82" height="1100" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="82" height="1100" fill="url(#lRecess)"/>
      <rect x="11" y="0" width="58" height="1100" rx="5" fill="url(#lSlat)"/>
      <rect x="11" y="0" width="58" height="20" rx="5" fill="url(#lTop)"/>
      <rect x="68" y="0" width="10" height="1100" fill="#000000" opacity=".6"/>
    </pattern>

    <filter id="lGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 1.2" numOctaves="4" seed="27"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .16  0 0 0 0 .09  0 0 0 0 .03  .7 0 0 0 -.34"/>
    </filter>

    <filter id="lSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <linearGradient id="lRake" x1="0.06" y1="0" x2="0.9" y2="0.85">
      <stop offset="0"    stop-color="#ffd7a2" stop-opacity=".22"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="0.74" stop-color="#0c0805" stop-opacity=".34"/>
      <stop offset="1"    stop-color="#080503" stop-opacity=".70"/>
    </linearGradient>

    <clipPath id="lNear"><rect x="0" y="0" width="1108" height="1100"/></clipPath>
    <clipPath id="lFar"><rect x="1108" y="0" width="492" height="1100"/></clipPath>
  </defs>

  <rect width="1600" height="1100" fill="#0b0704"/>
  <g clip-path="url(#lFar)">
    <rect x="1108" y="0" width="492" height="1100" fill="url(#lPatFar)"/>
    <rect x="1108" y="0" width="492" height="1100" fill="#0a0604" opacity=".34"/>
  </g>
  <g clip-path="url(#lNear)">
    <rect x="0" y="0" width="1108" height="1100" fill="url(#lPat)"/>
  </g>
  <!-- shadow the near run throws across the far one -->
  <g filter="url(#lSoft)" opacity=".8">
    <rect x="1090" y="-40" width="120" height="1180" fill="#000000" opacity=".62"/>
  </g>
  <rect width="1600" height="1100" filter="url(#lGrain)" opacity=".5"/>
  <rect width="1600" height="1100" fill="url(#lRake)"/>
</svg>
