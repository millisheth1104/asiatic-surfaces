<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="eBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#d8d2c3"/>
    </linearGradient>

    <!-- each band is a stroked path: PVC has a soft sheen down its length -->
    <linearGradient id="eSage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa287"/><stop offset="0.3" stop-color="#cdd9c6"/>
      <stop offset="0.6" stop-color="#b9c8b3"/><stop offset="1" stop-color="#7a8b72"/>
    </linearGradient>
    <linearGradient id="eWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4320"/><stop offset="0.3" stop-color="#c08c53"/>
      <stop offset="0.6" stop-color="#8f5c30"/><stop offset="1" stop-color="#54331a"/>
    </linearGradient>
    <linearGradient id="ePowder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8db2c0"/><stop offset="0.3" stop-color="#d7ebf1"/>
      <stop offset="0.6" stop-color="#b8d5de"/><stop offset="1" stop-color="#7ba0ae"/>
    </linearGradient>
    <linearGradient id="eInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181a"/><stop offset="0.3" stop-color="#4a545a"/>
      <stop offset="0.6" stop-color="#2c3337"/><stop offset="1" stop-color="#0d1012"/>
    </linearGradient>
    <linearGradient id="eSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbcd8"/><stop offset="0.3" stop-color="#e6f2ff"/>
      <stop offset="0.6" stop-color="#d2e8ff"/><stop offset="1" stop-color="#93b4d2"/>
    </linearGradient>

    <filter id="eShadow" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4b463a" flood-opacity=".40"/>
    </filter>
    <filter id="eGrit" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="21"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .41  0 0 0 0 .36  .34 0 0 0 -.16"/>
    </filter>
    <radialGradient id="eVig" cx="0.3" cy="0.1" r="1.05">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4b463a" stop-opacity=".34"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#eBg)"/>

  <!-- coiled banding relaxing across the bench; thickness edge under each face -->
  <g fill="none" stroke-linecap="butt">
    <g filter="url(#eShadow)">
      <path d="M-80 168 Q 420 96 820 170 T 1700 130" stroke="#5c6455" stroke-width="104" transform="translate(0,9)"/>
      <path d="M-80 168 Q 420 96 820 170 T 1700 130" stroke="url(#eSage)" stroke-width="96"/>
      <path d="M-80 140 Q 420 68 820 142 T 1700 102" stroke="#ffffff" stroke-width="9" opacity=".34"/>
    </g>
    <g filter="url(#eShadow)">
      <path d="M-80 386 Q 460 458 900 380 T 1700 424" stroke="#3d2611" stroke-width="112" transform="translate(0,9)"/>
      <path d="M-80 386 Q 460 458 900 380 T 1700 424" stroke="url(#eWood)" stroke-width="104"/>
      <path d="M-80 356 Q 460 428 900 350 T 1700 394" stroke="#ffe3bd" stroke-width="9" opacity=".30"/>
    </g>
    <g filter="url(#eShadow)">
      <path d="M-80 606 Q 400 540 860 612 T 1700 570" stroke="#5a7480" stroke-width="100" transform="translate(0,9)"/>
      <path d="M-80 606 Q 400 540 860 612 T 1700 570" stroke="url(#ePowder)" stroke-width="92"/>
      <path d="M-80 578 Q 400 512 860 584 T 1700 542" stroke="#ffffff" stroke-width="9" opacity=".38"/>
    </g>
    <g filter="url(#eShadow)">
      <path d="M-80 822 Q 480 890 920 816 T 1700 856" stroke="#050708" stroke-width="110" transform="translate(0,9)"/>
      <path d="M-80 822 Q 480 890 920 816 T 1700 856" stroke="url(#eInk)" stroke-width="102"/>
      <path d="M-80 792 Q 480 860 920 786 T 1700 826" stroke="#cfe0e8" stroke-width="8" opacity=".26"/>
    </g>
    <g filter="url(#eShadow)">
      <path d="M-80 1024 Q 420 962 880 1030 T 1700 992" stroke="#7e97ad" stroke-width="98" transform="translate(0,9)"/>
      <path d="M-80 1024 Q 420 962 880 1030 T 1700 992" stroke="url(#eSky)" stroke-width="90"/>
      <path d="M-80 996 Q 420 934 880 1002 T 1700 964" stroke="#ffffff" stroke-width="9" opacity=".42"/>
    </g>
  </g>

  <rect width="1600" height="1100" filter="url(#eGrit)" opacity=".26"/>
  <rect width="1600" height="1100" fill="url(#eVig)"/>
</svg>
