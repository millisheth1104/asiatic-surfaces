<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- half-round flute, matte: no hot specular, just a broad soft rise -->
    <linearGradient id="cFlute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#050607"/>
      <stop offset="0.08" stop-color="#171b1e"/>
      <stop offset="0.26" stop-color="#3f484e"/>
      <stop offset="0.44" stop-color="#5b666d"/>
      <stop offset="0.58" stop-color="#4c565c"/>
      <stop offset="0.80" stop-color="#282f34"/>
      <stop offset="0.94" stop-color="#0d1012"/>
      <stop offset="1"    stop-color="#040506"/>
    </linearGradient>

    <!-- the V groove between flutes -->
    <linearGradient id="cGroove" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#000000" stop-opacity=".92"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="1"/>
      <stop offset="1"   stop-color="#000000" stop-opacity=".88"/>
    </linearGradient>

    <linearGradient id="cTopEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#c8dae2" stop-opacity=".40"/>
      <stop offset="0.5" stop-color="#7c8c94" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#7c8c94" stop-opacity="0"/>
    </linearGradient>

    <pattern id="cPat" width="104" height="1100" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="104" height="1100" fill="#070809"/>
      <rect x="7" y="0" width="90" height="1100" rx="8" fill="url(#cFlute)"/>
      <rect x="97" y="0" width="9" height="1100" fill="url(#cGroove)"/>
      <rect x="7" y="0" width="90" height="30" rx="8" fill="url(#cTopEdge)"/>
    </pattern>

    <!-- bamboo-charcoal tooth: matte, slightly gritty -->
    <filter id="cTooth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42 0.42" numOctaves="3" seed="71"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .62  0 0 0 0 .66  0 0 0 0 .69  .42 0 0 0 -.20"/>
    </filter>
    <filter id="cStreak" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.9" numOctaves="3" seed="14"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .05  0 0 0 0 .06  0 0 0 0 .07  .5 0 0 0 -.26"/>
    </filter>

    <!-- one soft wash of daylight from the upper right -->
    <radialGradient id="cWash" cx="0.78" cy="0.06" r="1.02">
      <stop offset="0"    stop-color="#dcecf3" stop-opacity=".26"/>
      <stop offset="0.44" stop-color="#93a8b1" stop-opacity=".06"/>
      <stop offset="1"    stop-color="#000000" stop-opacity=".52"/>
    </radialGradient>
    <linearGradient id="cFloor" x1="0" y1="0.6" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".42"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="#070809"/>
  <rect width="1600" height="1100" fill="url(#cPat)"/>
  <rect width="1600" height="1100" filter="url(#cStreak)" opacity=".5"/>
  <rect width="1600" height="1100" filter="url(#cTooth)" opacity=".34"/>
  <rect width="1600" height="1100" fill="url(#cWash)"/>
  <rect width="1600" height="1100" fill="url(#cFloor)"/>
</svg>
