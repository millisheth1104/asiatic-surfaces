<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Immersive 360° virtual tour of a beautifully designed home interior. Drag to look around, zoom in and out, and explore every detail in full panoramic view.">
    <title>Asiatic Surfaces</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Pannellum CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-ring">
                <div class="ring-segment"></div>
                <div class="ring-segment"></div>
                <div class="ring-segment"></div>
            </div>
            <h2 class="loader-title">Preparing Your Tour</h2>
            <p class="loader-subtitle">Loading 360° panorama...</p>
            <div class="loader-bar">
                <div class="loader-bar-fill" id="loader-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div id="app-container">

        <!-- Header Bar -->
        <header id="header-bar">
            <div class="header-left">
                <a href="index.html" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 14px;">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
                            <ellipse cx="12" cy="12" rx="4" ry="10" stroke="currentColor" stroke-width="1.5"/>
                            <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>360° Virtual Tour</h1>
                        <p>Bedroom Interior</p>
                    </div>
                </a>
            </div>
            <div class="header-right" style="display: flex; gap: 10px; align-items: center;">
                <a href="products.html" class="fullsheet-toggle-btn" style="text-decoration: none;" title="Product Catalog & Table" aria-label="Product Catalog">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="8" y1="6" x2="21" y2="6"/>
                        <line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/>
                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                    <span>Product Catalog</span>
                </a>
                <button class="fullsheet-toggle-btn" id="btn-fullsheet" title="View Fullsheet" aria-label="View Fullsheet">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="M21 15l-5-5L5 21"/>
                    </svg>
                    <span>Fullsheet</span>
                </button>
            </div>
        </header>

        <!-- Panorama Viewer -->
        <div id="panorama-viewer"></div>

        <!-- Custom Controls Overlay -->
        <div id="controls-overlay">

            <!-- Left side: Compass -->
            <div class="controls-left">
                <div class="compass-container" id="compass">
                    <div class="compass-ring">
                        <div class="compass-needle" id="compass-needle">
                            <div class="needle-north">N</div>
                            <div class="needle-line"></div>
                            <div class="needle-south">S</div>
                        </div>
                    </div>
                    <div class="compass-label">Compass</div>
                </div>
            </div>

            <!-- Right side: Control Buttons -->
            <div class="controls-right">
                <div class="control-group">
                    <button class="control-btn" id="btn-zoom-in" title="Zoom In" aria-label="Zoom In">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            <line x1="11" y1="8" x2="11" y2="14"/>
                            <line x1="8" y1="11" x2="14" y2="11"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="btn-zoom-out" title="Zoom Out" aria-label="Zoom Out">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            <line x1="8" y1="11" x2="14" y2="11"/>
                        </svg>
                    </button>
                    <div class="control-divider"></div>
                    <button class="control-btn" id="btn-auto-rotate" title="Toggle Auto-Rotate" aria-label="Toggle Auto-Rotate">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M21.5 2v6h-6"/>
                            <path d="M2.5 22v-6h6"/>
                            <path d="M2.5 11.5a10 10 0 0 1 16.5-5.8L21.5 8"/>
                            <path d="M21.5 12.5a10 10 0 0 1-16.5 5.8L2.5 16"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="btn-reset" title="Reset View" aria-label="Reset View">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="btn-gyro" title="Toggle Gyroscope" aria-label="Toggle Gyroscope">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="12" r="9"/>
                            <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(45 12 12)"/>
                            <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-45 12 12)"/>
                            <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
                        </svg>
                    </button>
                    <div class="control-divider"></div>
                    <button class="control-btn" id="btn-fullscreen" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="fullscreen-icon">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                            <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                            <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                            <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                        </svg>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="exit-fullscreen-icon" style="display:none;">
                            <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
                            <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
                            <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
                            <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Bottom: Info bar -->
            <div class="controls-bottom">
                <div class="info-pill" id="info-fov">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <span id="fov-value">100°</span>
                </div>
                <div class="info-pill" id="info-direction">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polygon points="3 11 22 2 13 21 11 13 3 11"/>
                    </svg>
                    <span id="direction-value">0° / 0°</span>
                </div>
                <div class="hint-pill" id="drag-hint">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M5 9l-3 3 3 3"/>
                        <path d="M9 5l3-3 3 3"/>
                        <path d="M15 19l-3 3-3-3"/>
                        <path d="M19 9l3 3-3 3"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <line x1="12" y1="2" x2="12" y2="22"/>
                    </svg>
                    Drag to look around
                </div>
            </div>
        </div>
    </div>

    <!-- Fullsheet Viewer Overlay -->
    <div id="fullsheet-overlay" class="fullsheet-overlay" style="display:none;">
        <div class="fullsheet-header">
            <div class="fullsheet-title-area">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <span>Fullsheet View</span>
            </div>
            <div class="fullsheet-actions">
                <button class="fullsheet-action-btn" id="fullsheet-zoom-in" title="Zoom In" aria-label="Zoom In">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        <line x1="11" y1="8" x2="11" y2="14"/>
                        <line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                </button>
                <button class="fullsheet-action-btn" id="fullsheet-zoom-out" title="Zoom Out" aria-label="Zoom Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        <line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                </button>
                <button class="fullsheet-action-btn" id="fullsheet-zoom-reset" title="Reset Zoom" aria-label="Reset Zoom">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
                <div class="fullsheet-action-divider"></div>
                <button class="fullsheet-action-btn fullsheet-close-btn" id="fullsheet-close" title="Close" aria-label="Close Fullsheet">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="fullsheet-image-container" id="fullsheet-image-container">
            <img src="src/Fullsheet/Fullsheet1.jpeg" alt="Fullsheet texture view" id="fullsheet-image" draggable="false"/>
        </div>
        <div class="fullsheet-zoom-indicator" id="fullsheet-zoom-indicator">100%</div>
    </div>

    <!-- Gyroscope Permission Modal (for iOS) -->
    <div id="gyro-modal" class="gyro-modal-overlay" style="display:none;">
        <div class="gyro-modal-card">
            <div class="gyro-modal-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <rect x="5" y="2" width="14" height="20" rx="3"/>
                    <circle cx="12" cy="18" r="1"/>
                    <path d="M9 6h6"/>
                    <!-- motion arrows -->
                    <path d="M2 10l-1-2 1-2" opacity="0.5"/>
                    <path d="M22 10l1-2-1-2" opacity="0.5"/>
                    <path d="M10 1L12 0l2 1" opacity="0.5"/>
                </svg>
            </div>
            <h3 class="gyro-modal-title">Enable Motion Sensors</h3>
            <p class="gyro-modal-desc">Allow access to your device's gyroscope to look around by tilting your phone.</p>
            <div class="gyro-modal-actions">
                <button id="gyro-modal-cancel" class="gyro-modal-btn gyro-modal-btn-secondary">Cancel</button>
                <button id="gyro-modal-allow" class="gyro-modal-btn gyro-modal-btn-primary">Allow</button>
            </div>
        </div>
    </div>

    <!-- Pannellum JS -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Shared Product Data Engine -->
    <script src="products-data.js"></script>

    <!-- Custom Script -->
    <script src="app.js"></script>
</body>
</html>
