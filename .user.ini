; Picked up automatically by PHP-FPM (which Hostinger shared hosting runs) without any
; server restart - takes effect within a few minutes of deploy. These raise the ceiling
; for /api/upload, which posts an image as a base64 JSON body rather than a multipart
; file: post_max_size and memory_limit are what actually govern it, since PHP has to
; hold the ~1.37x-inflated base64 string and its decoded bytes in memory at once.
;
; 50 MB image -> ~70 MB base64 body. Set with headroom, not exactly on the line.
upload_max_filesize = 80M
post_max_size = 96M
memory_limit = 384M
max_execution_time = 120
max_input_time = 120
