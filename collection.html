<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection — Full Sheet View</title>
<meta name="description" content="A Full Sheet View collection, shown as full sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asar&family=Palanquin:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=3.8">
<link rel="stylesheet" href="assets/css/gallery.css?v=3.8">
</head>
<body class="page-gallery">

<div class="scroll-progress" aria-hidden="true"><span id="scrollBar"></span></div>

<header class="gnav">
  <span class="gnav__brand">Full Sheet View</span>
</header>

<main class="gpage">

  <div class="ghead-row">
    <header class="ghead">
      <p class="eyebrow"><span class="eyebrow__rule"></span>The Collection</p>
      <h1 class="ghead__title" id="collectionTitle">Collection</h1>
      <p class="ghead__sub" id="collectionSub"></p>
    </header>

  <form class="gsearch" role="search">
    <svg class="gsearch__ico" width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="5.4" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 3.6 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input class="gsearch__in" id="sheetSearch" type="search" placeholder="Search by code or name"
           aria-label="Search sheets by code or name" autocomplete="off" spellcheck="false">
  </form>
  </div>

  <!-- Masonry Gallery - dynamically populated from Product Catalog -->
  <div class="masonry" id="masonry"></div>

</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Full sheet view" aria-hidden="true">
  <div class="lb__bar">
    <p class="lb__code"></p>
    <span class="lb__count"></span>
    <button class="lb__x" type="button" aria-label="Close"><svg viewBox="0 0 20 20" fill="none"><path d="m5.5 5.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="lb__stage">
    <button class="lb__nav lb__nav--prev" type="button" aria-label="Previous sheet"><svg viewBox="0 0 20 20" fill="none"><path d="M12 4.5 6.5 10 12 15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <img alt="">
    <button class="lb__nav lb__nav--next" type="button" aria-label="Next sheet"><svg viewBox="0 0 20 20" fill="none"><path d="M8 4.5 13.5 10 8 15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <p class="lb__foot">Synchro · Full Sheet View</p>
</div>

<footer class="gfoot">
  <span class="gfoot__brand">Full Sheet View</span>
  <span class="gfoot__credit"><a href="https://thepurestudio.in/" target="_blank" rel="noopener">Designed by The Pure Studio</a></span>
</footer>

<!-- Shared Product Data Engine & Dynamic Masonry Gallery -->
<script src="products-data.js?v=3.8"></script>


<script>
/* A custom collection is named by ?cat=<slug>. gallery.js reads data-category once, at
   load, so the attribute has to be right before it runs - which is why the script is
   injected here rather than declared above: the name comes from the API. */
(function () {
  var params = new URLSearchParams(window.location.search);
  var slug = (params.get('cat') || params.get('category') || '').toLowerCase();

  function titleCase(s) {
    return s.replace(/-/g, ' ').replace(/\w/g, function (m) { return m.toUpperCase(); });
  }

  function apply(name, blurb) {
    document.body.setAttribute('data-category', name);
    var page = document.querySelector('.gpage');
    if (page) page.setAttribute('data-category', name);
    var t = document.getElementById('collectionTitle');
    if (t) t.textContent = name;
    var sub = document.getElementById('collectionSub');
    if (sub && blurb) sub.textContent = blurb;
    document.title = name + ' — Full Sheet View';
  }

  function startGallery() {
    var tag = document.createElement('script');
    tag.src = 'assets/js/gallery.js?v=3.8';
    document.body.appendChild(tag);
  }

  if (!slug) { apply('Collection'); startGallery(); return; }

  // Shown immediately so the heading is never blank while the record loads.
  apply(titleCase(slug));

  fetch('/api/categories?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      var hit = data && (data.categories || []).filter(function (c) { return c.slug === slug; })[0];
      if (hit) apply(hit.name, hit.blurb);
    })
    .catch(function () { })
    .then(startGallery);
})();
</script>
</body>
</html>
