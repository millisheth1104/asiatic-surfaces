<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS &amp; Asset Check — Full Sheet View</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/gallery.css">

<style>
  .report { max-width:900px; margin:0 auto; padding:24px;
            font:15px/1.6 ui-sans-serif, system-ui, sans-serif; color:#14110f; }
  .report h1 { font-size:21px; margin:0 0 18px; }
  .report h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em;
               color:#6b625a; margin:26px 0 8px; }
  .r { display:flex; gap:14px; padding:9px 13px; background:#fffdf8;
       border:1px solid #e3dcd0; border-radius:8px; margin-bottom:6px; }
  .r b { min-width:280px; font-weight:600; }
  .ok { color:#1f6b35; font-weight:700; }
  .bad { color:#9c2b1c; font-weight:700; }
  .stage { background:#efe9dd; border-radius:10px; padding:18px; margin-top:6px; }
</style>
</head>
<body style="background:#f5f0e8">
<div class="report">
  <h1>CSS &amp; Asset Check</h1>
  <p>Measures what your browser actually applied, not what the file says.</p>

  <h2>Live sample — search icon</h2>
  <div class="stage">
    <form class="gsearch" role="search" onsubmit="return false">
      <svg class="gsearch__ico" id="probeIco" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="5.4" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 3.6 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input class="gsearch__in" type="search" placeholder="Search by code or name">
    </form>
  </div>

  <h2>Live sample — feature chip</h2>
  <div class="stage" style="display:flex; gap:12px">
    <div class="chip chip--feat" data-feat="full-sheet-view" id="probeChip">
      <span class="chip__media" id="probeMedia"></span>
      <span class="chip__body"><b>Full Sheet View</b><em>Sample</em></span>
    </div>
    <div class="chip chip--feat" data-feat="immersive-360">
      <span class="chip__media"></span>
      <span class="chip__body"><b>Immersive 360°</b><em>Sample</em></span>
    </div>
  </div>

  <h2>Measurements</h2>
  <div id="out">measuring…</div>
</div>

<script>
(function () {
  var out = document.getElementById('out');
  function row(l, v, cls) {
    return '<div class="r"><b>' + l + '</b><span class="' + (cls||'') + '">' + v + '</span></div>';
  }

  window.addEventListener('load', async function () {
    var html = '';

    // Which stylesheets actually parsed?
    var sheets = Array.prototype.map.call(document.styleSheets, function (s) {
      var n = 'inline';
      if (s.href) n = s.href.split('/').slice(-2).join('/');
      var count = 0;
      try { count = s.cssRules.length; } catch (e) { count = 'BLOCKED'; }
      return n + ' → ' + count + ' rules';
    });
    sheets.forEach(function (s) { html += row('Stylesheet loaded', s, s.indexOf('0 rules') > -1 ? 'bad' : 'ok'); });

    // The search icon: should be 16 x 16
    var ico = document.getElementById('probeIco');
    var cs = getComputedStyle(ico);
    var box = ico.getBoundingClientRect();
    var icoOk = Math.round(box.width) === 16 && Math.round(box.height) === 16;
    html += row('Search icon computed size', cs.width + ' x ' + cs.height, icoOk ? 'ok' : 'bad');
    html += row('Search icon rendered size', Math.round(box.width) + ' x ' + Math.round(box.height) + ' px',
                icoOk ? 'ok' : 'bad');
    html += row('Search icon position', cs.position, cs.position === 'absolute' ? 'ok' : 'bad');

    // The chip background: should resolve to a features/*.webp url
    var chip = document.getElementById('probeChip');
    var media = document.getElementById('probeMedia');
    var tex = getComputedStyle(chip).getPropertyValue('--tex').trim();
    var bg = getComputedStyle(media).backgroundImage;
    html += row('Chip --tex variable', tex || 'EMPTY — CSS rule missing', tex ? 'ok' : 'bad');
    html += row('Chip background-image', bg === 'none' ? 'none — not applied' : bg, bg === 'none' ? 'bad' : 'ok');

    // Do the image files actually load in this browser?
    var files = ['full-sheet-view-420','immersive-360-420','premium-grade-420','trending-designs-420'];
    for (var i = 0; i < files.length; i++) {
      var url = 'assets/features/' + files[i] + '.webp';
      var res = await new Promise(function (resolve) {
        var im = new Image();
        im.onload = function () { resolve('loaded ' + im.naturalWidth + 'x' + im.naturalHeight); };
        im.onerror = function () { resolve('FAILED TO LOAD'); };
        im.src = url + '?probe=' + Date.now();
      });
      html += row(files[i] + '.webp', res, res.indexOf('FAILED') > -1 ? 'bad' : 'ok');
    }

    // WebP support at all
    var webpOk = await new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () { resolve(im.width === 1); };
      im.onerror = function () { resolve(false); };
      im.src = 'data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==';
    });
    html += row('Browser supports WebP', webpOk ? 'yes' : 'NO — that is the cause', webpOk ? 'ok' : 'bad');
    html += row('Browser', navigator.userAgent, '');

    out.innerHTML = html;
  });
})();
</script>
</body>
</html>
